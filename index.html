<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MovieMarks">
  <title>MovieMarks</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1">
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <style>
    :root{color-scheme:dark;--bg:#08090a;--panel:#111315;--line:#292d31;--text:#f5f5f5;--muted:#92979d;--red:#e1262d}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px}
    main{width:min(420px,100%);text-align:center}.logo{width:148px;height:148px;border-radius:32px;display:block;margin:0 auto 24px;box-shadow:0 24px 70px #000}
    h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}p{color:var(--muted);line-height:1.75;margin:0 auto 26px;max-width:340px}
    .card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:18px;margin:0 0 16px;color:#c9cdd1;line-height:1.8;font-size:14px}
    .card b{color:#fff}.open{display:block;text-decoration:none;background:var(--red);color:#fff;border-radius:13px;padding:15px;font-weight:800}
    small{display:block;color:#676d73;margin-top:18px;direction:ltr}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="apple-touch-icon.png?v=1" alt="MovieMarks">
    <h1>MovieMarks</h1>
    <p>کتابخانه شخصی فیلم و سریال‌های تو</p>
    <div class="card"><b>برای نصب روی آیفون:</b><br>دکمه Share را بزن و Add to Home Screen را انتخاب کن.</div>
    <a id="openApp" class="open" href="#">بازکردن MovieMarks</a>
    <small>Private cinema journal</small>
  </main>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbx_R7jafzk1cBmBDB86DxV1y8dZdxvHDe8c9_LwDE_HWI__Pt1Da9GHVq9vuA3SD8hzgQ/exec';
    document.getElementById('openApp').href=APP_URL;
    if(window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches){window.location.replace(APP_URL)}
  </script>
</body>
</html>

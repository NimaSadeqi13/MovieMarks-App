<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MovieMarks">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MovieMarks</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#070809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#070809;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
    #loading{position:fixed;z-index:30;inset:0;display:grid;place-items:center;background:#070809;transition:opacity .18s ease}
    #loading.hide{opacity:0;pointer-events:none}.box{text-align:center}.mark{width:112px;height:112px;border-radius:26px;display:block;margin:auto;box-shadow:0 18px 60px #000}
    .spin{width:24px;height:24px;border:2px solid #333;border-top-color:#ed2730;border-radius:50%;margin:22px auto 0;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    .shell-nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(66px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(9,11,12,.98);border-top:1px solid #252a2e;box-shadow:0 -12px 30px rgba(0,0,0,.38)}
    .shell-nav button{appearance:none;border:0;background:transparent;color:#858b91;display:grid;place-items:center;align-content:center;gap:3px;font:600 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-width:0;border-radius:13px}
    .shell-nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .shell-nav button.active{color:#f4f5f6;background:#191c1f}.shell-nav button.active svg{stroke:#ef2b33}
  </style>
</head>
<body>
  <div id="loading"><div class="box"><img class="mark" src="apple-touch-icon-v2.png" alt="MovieMarks"><div class="spin"></div></div></div>
  <iframe id="app" title="MovieMarks" allow="fullscreen"></iframe>
  <nav id="shellNav" class="shell-nav" aria-label="Main navigation">
    <button class="active" data-tab="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg><span>Home</span></button>
    <button data-tab="movies" aria-label="Movies"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="m7 5 2-3m4 3 2-3m4 3 2-3M3 10h18"/></svg><span>Movies</span></button>
    <button data-tab="series" aria-label="Series"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="m9 3 3 3 3-3M8 11h8M8 15h5"/></svg><span>Series</span></button>
    <button data-tab="library" aria-label="Library"><svg viewBox="0 0 24 24"><path d="M4 4h5v16H4zM10 4h5v16h-5zM16 5l4-1 2 15-4 1z"/></svg><span>Library</span></button>
  </nav>
  <script>
    const APP_URL='https://script.google.com/macros/s/AKfycbx_R7jafzk1cBmBDB86DxV1y8dZdxvHDe8c9_LwDE_HWI__Pt1Da9GHVq9vuA3SD8hzgQ/exec?v=18';
    const frame=document.getElementById('app'),loading=document.getElementById('loading'),buttons=[...document.querySelectorAll('.shell-nav button')];
    let appWindow=null,pendingTab='home',ignoreNextPop=false;
    const SESSION_KEY='mm_session_shell';

    function hideLoading(){loading.classList.add('hide')}
    function setActive(tab){buttons.forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
    function sendNav(tab,fromHistory=false){pendingTab=tab;setActive(tab);if(appWindow)appWindow.postMessage({type:'moviemarks-nav',tab,fromHistory},'*')}
    function postBack(){if(appWindow)appWindow.postMessage({type:'moviemarks-back'},'*')}
    function safeToken(){try{return localStorage.getItem(SESSION_KEY)||''}catch(e){return''}}
    function saveToken(token){try{token?localStorage.setItem(SESSION_KEY,token):localStorage.removeItem(SESSION_KEY)}catch(e){}}

    let exitArmed=false,exitTimer=null;
    function armGuard(){history.pushState({mm:true,kind:'guard'},'',location.href)}
    function showExitToast(){
      let t=document.getElementById('exitToast');
      if(!t){
        t=document.createElement('div');
        t.id='exitToast';
        t.style.cssText='position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#171a1d;color:#f4f5f6;padding:10px 16px;border-radius:10px;font:600 13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;transition:opacity .18s ease;pointer-events:none';
        document.body.appendChild(t);
      }
      t.textContent='برای خروج، دوباره دکمه برگشت را بزنید';
      t.style.opacity='1';
      clearTimeout(t._h);
      t._h=setTimeout(()=>{t.style.opacity='0'},1600);
    }

    history.replaceState({mm:true,kind:'root',value:'home'},'',location.href);
    armGuard(); // extra dummy entry so the very first Back press never leaves the app

    buttons.forEach(button=>button.addEventListener('click',()=>{
      const tab=button.dataset.tab;
      if(tab===pendingTab)return;
      history.pushState({mm:true,kind:'tab',value:tab},'',location.href);
      sendNav(tab);
    }));

    window.addEventListener('popstate',event=>{
      if(ignoreNextPop){ignoreNextPop=false;return}
      const state=event.state||{};
      if(state.kind==='tab'&&state.value){
        pendingTab=state.value;setActive(state.value);
        sendNav(state.value,true);
        return;
      }
      if(!state.kind||state.kind==='root'||state.kind==='guard'){
        pendingTab='home';setActive('home');
        sendNav('home',true);
        if(exitArmed){clearTimeout(exitTimer);return} // 2nd press: let the OS handle the next Back normally
        exitArmed=true;
        showExitToast();
        exitTimer=setTimeout(()=>{exitArmed=false},2000);
        armGuard(); // re-arm so this Back press doesn't leave the app either
        return;
      }
      // a 'list' or 'title' entry was popped: let the app close its own overlay
      postBack();
    });

    window.addEventListener('message',event=>{
      let host='';try{host=new URL(event.origin).hostname}catch(e){}
      if(host!=='script.google.com'&&!host.endsWith('.googleusercontent.com'))return;
      const d=event.data||{};
      if(d.type==='moviemarks-ready'){
        appWindow=event.source;
        appWindow.postMessage({type:'moviemarks-shell'},'*');
        appWindow.postMessage({type:'moviemarks-nav',tab:pendingTab},'*');
        appWindow.postMessage({type:'moviemarks-session-response',token:safeToken()},'*');
        hideLoading();
      }
      if(d.type==='moviemarks-session-request'&&appWindow)appWindow.postMessage({type:'moviemarks-session-response',token:safeToken()},'*');
      if(d.type==='moviemarks-session-save')saveToken(String(d.token||''));
      if(d.type==='moviemarks-session-clear')saveToken('');
      if(d.type==='moviemarks-history-push')history.pushState({mm:true,kind:d.kind||'view',value:d.value||''},'',location.href);
      if(d.type==='moviemarks-history-replace')history.replaceState({mm:true,kind:d.kind||'view',value:d.value||''},'',location.href);
      if(d.type==='moviemarks-history-back'){
        if(history.state&&history.state.kind!=='root'){ignoreNextPop=true;history.back()}
      }
    });

    frame.addEventListener('load',()=>setTimeout(hideLoading,1200));
    frame.src=APP_URL;
  </script>
</body>
</html>

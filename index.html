<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#070809">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MovieMarks">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MovieMarks</title>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#070809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #app{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#070809}
    #loading{position:fixed;z-index:2;inset:0;display:grid;place-items:center;background:#070809;transition:opacity .18s ease}
    #loading.hide{opacity:0;pointer-events:none}.box{text-align:center}.logo{width:112px;height:112px;border-radius:26px;display:block;margin:auto;box-shadow:0 18px 60px #000}
    .spin{width:24px;height:24px;border:2px solid #333;border-top-color:#e1262d;border-radius:50%;margin:22px auto 0;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
    .fallback{position:fixed;z-index:3;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:none;text-align:center;color:#aaa;font-size:13px}.fallback a{color:#fff}
  </style>
</head>
<body>
  <div id="loading"><div class="box"><img class="mark" src="apple-touch-icon-v2.png" alt="MovieMarks"><div class="spin"></div></div></div>
  <iframe id="app" title="MovieMarks" allow="fullscreen" src="https://script.google.com/macros/s/AKfycbx_R7jafzk1cBmBDB86DxV1y8dZdxvHDe8c9_LwDE_HWI__Pt1Da9GHVq9vuA3SD8hzgQ/exec?v=7"></iframe>
  <div id="fallback" class="fallback">If loading takes too long, <a href="https://script.google.com/macros/s/AKfycbx_R7jafzk1cBmBDB86DxV1y8dZdxvHDe8c9_LwDE_HWI__Pt1Da9GHVq9vuA3SD8hzgQ/exec?v=7">open MovieMarks directly</a>.</div>
  <script>
    const frame=document.getElementById('app'),loading=document.getElementById('loading'),fallback=document.getElementById('fallback');
    frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hide'),250));
    setTimeout(()=>{if(!loading.classList.contains('hide'))fallback.style.display='block'},9000);
  </script>
</body>
</html>
